<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tile Match</title>
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://api.web3forms.com; worker-src 'self'; manifest-src 'self'; font-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#86BBF9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tile Match">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="js/game.js">
  <link rel="modulepreload" href="js/board.js">
  <link rel="modulepreload" href="js/art.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/riders.js">
  <link rel="modulepreload" href="js/shop.js">
  <link rel="modulepreload" href="js/hud.js">
  <link rel="modulepreload" href="js/icons.js">
</head>
<body>
  <canvas id="backdrop" aria-hidden="true" hidden></canvas>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="status-strip" aria-hidden="true"></div>
  <div id="ui"></div>
  <div id="safe-probe"></div>
  <div id="lvh-probe"></div>
  <!-- Opening animation. Plain HTML + CSS so it is on screen from the very first paint and
       fades itself out even if a script fails; js/splash.js adds the rider, skipping and replays. -->
  <div id="splash" class="play" aria-hidden="true">
    <div class="sp-scene">
      <div class="sp-sun"></div>
      <div class="sp-title">
        <div class="sp-row"><span class="sp-t">T</span><span class="sp-t">I</span><span class="sp-t">L</span><span class="sp-t">E</span></div>
        <div class="sp-row"><span class="sp-t">M</span><span class="sp-t">A</span><span class="sp-t">T</span><span class="sp-t">C</span><span class="sp-t">H</span></div>
      </div>
      <div class="sp-pair">
        <span class="sp-t sp-a"></span><span class="sp-t sp-b"></span>
        <div class="sp-burst"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <span class="sp-heart"></span>
      </div>
      <p class="sp-sub">made for you</p>
      <div class="sp-road"></div>
      <div class="sp-home"></div>
      <div class="sp-rider"><div class="sp-bob"></div></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
